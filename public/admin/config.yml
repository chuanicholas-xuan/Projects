# Settings for the /admin dashboard (Sveltia CMS).
# Each collection below is a section in the dashboard sidebar.

backend:
  name: github
  repo: chuanicholas-xuan/Projects
  branch: main

site_url: https://chuanicholas-xuan.github.io/Projects
display_url: https://chuanicholas-xuan.github.io/Projects

# Uploaded images go to src/assets/images so Astro can optimize them.
media_folder: src/assets/images
public_folder: /src/assets/images

collections:
  - name: blog
    label: Blog
    label_singular: Post
    icon: edit_note
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    summary: '{{title}}'
    sortable_fields: [pubDatetime, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: description, widget: string, hint: One line shown in lists and search results. }
      - { label: Published, name: pubDatetime, widget: datetime }
      - { label: Last updated, name: modDatetime, widget: datetime, required: false }
      - { label: Tags, name: tags, widget: list, required: false, default: [] }
      - { label: Featured on home page, name: featured, widget: boolean, required: false, default: false }
      - { label: Draft (hide from site), name: draft, widget: boolean, required: false, default: false }
      - { label: Body, name: body, widget: markdown }

  - name: notes
    label: Notes
    label_singular: Note
    icon: sticky_note_2
    folder: src/content/notes
    create: true
    slug: '{{slug}}'
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    summary: '{{title}}'
    sortable_fields: [pubDatetime, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: description, widget: string, hint: One line shown in lists and search results. }
      - { label: Published, name: pubDatetime, widget: datetime }
      - { label: Last updated, name: modDatetime, widget: datetime, required: false }
      - { label: Tags, name: tags, widget: list, required: false, default: [] }
      - { label: Featured on home page, name: featured, widget: boolean, required: false, default: false }
      - { label: Draft (hide from site), name: draft, widget: boolean, required: false, default: false }
      - { label: Body, name: body, widget: markdown }

  - name: projects
    label: Projects
    label_singular: Project
    icon: rocket_launch
    folder: src/content/projects
    create: true
    slug: '{{slug}}'
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    summary: '{{title}}'
    sortable_fields: [pubDatetime, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: description, widget: string, hint: One line shown in lists and search results. }
      - { label: Published, name: pubDatetime, widget: datetime }
      - { label: Last updated, name: modDatetime, widget: datetime, required: false }
      - { label: Tags, name: tags, widget: list, required: false, default: [] }
      - { label: Featured on home page, name: featured, widget: boolean, required: false, default: false }
      - { label: Draft (hide from site), name: draft, widget: boolean, required: false, default: false }
      - { label: Code (GitHub link), name: repo, widget: string, required: false }
      - { label: Live demo link, name: demo, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: pages
    label: Pages
    icon: description
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    files:
      - name: about
        label: About page
        file: src/content/pages/about.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Summary, name: description, widget: string, required: false }
          - { label: Body, name: body, widget: markdown }
